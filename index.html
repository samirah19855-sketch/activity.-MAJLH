<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المجلة التفاعلية: أدوات التوجيه (الحوافز والتدريب) | © سميرة الخيبري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* Pixar 3D Card & UI Styling */
        .pixar-card {
            background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.9);
            border: 4px solid rgba(255, 255, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pixar-btn {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 6px 0 #1e3a8a, 0 12px 20px rgba(29, 78, 216, 0.4);
            transition: all 0.15s ease;
        }
        .pixar-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e3a8a, 0 6px 10px rgba(29, 78, 216, 0.4);
        }

        .pixar-btn-gold {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            box-shadow: 0 6px 0 #92400e, 0 12px 20px rgba(217, 119, 6, 0.4);
        }
        .pixar-btn-gold:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #92400e;
        }

        .pixar-btn-green {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            box-shadow: 0 6px 0 #065f46, 0 12px 20px rgba(5, 150, 105, 0.4);
        }

        .floating {
            animation: float 3.5s ease-in-out infinite;
        }
        .floating-delayed {
            animation: float 3.5s ease-in-out 1.5s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .scene-transition {
            animation: fadeInScale 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 3D Character Avatar Styles */
        .avatar-3d {
            box-shadow: 0 15px 25px rgba(0,0,0,0.2), inset 0 -6px 12px rgba(0,0,0,0.15), inset 0 6px 12px rgba(255,255,255,0.8);
        }

        /* Print Styles for Certificate & Magazine */
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .pixar-card { box-shadow: none !important; border: 2px solid #cbd5e1 !important; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-3 md:p-6 text-slate-800">

    <!-- Top Interactive Header (HUD) -->
    <header class="w-full max-w-4xl flex flex-wrap items-center justify-between bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl px-4 py-3 mb-4 text-white no-print">
        <div class="flex items-center gap-3">
            <span class="bg-amber-400 text-slate-900 font-black px-3 py-1 rounded-xl text-sm shadow">المهارات الإدارية</span>
            <span class="text-sm md:text-base font-bold hidden sm:inline">الصف الثالث الثانوي</span>
        </div>

        <!-- Progress Bar -->
        <div class="flex-1 mx-4 max-w-xs">
            <div class="flex justify-between text-xs mb-1 font-bold text-blue-200">
                <span>المشهد <span id="scene-counter">1</span> من 10</span>
                <span id="progress-percent">10%</span>
            </div>
            <div class="w-full bg-slate-900/50 rounded-full h-3 p-0.5 border border-white/20">
                <div id="progress-bar" class="bg-gradient-to-l from-amber-400 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: 10%"></div>
            </div>
        </div>

        <!-- Gamification Points & Audio -->
        <div class="flex items-center gap-3">
            <button onclick="speakCurrentScene()" title="استمع للتعليق الصوتي" class="bg-blue-600 hover:bg-blue-500 p-2 rounded-xl border border-blue-400 shadow transition flex items-center gap-1 text-xs font-bold">
                <span>🔊</span> <span class="hidden md:inline">استمع</span>
            </button>
            <div class="bg-slate-900/60 border border-amber-400/50 px-3 py-1.5 rounded-xl flex items-center gap-1.5">
                <span class="text-amber-400 text-lg">⭐</span>
                <span id="points-display" class="font-black text-amber-300">0</span>
            </div>
        </div>
    </header>

    <!-- Main A4-Style Interactive Magazine Container -->
    <main id="magazine-container" class="w-full max-w-4xl pixar-card min-h-[620px] flex flex-col justify-between p-6 md:p-10 relative overflow-hidden">
        
        <!-- Decorative 3D Background Orbs -->
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-blue-400/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-64 h-64 bg-amber-400/10 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Dynamic Scene Content Area -->
        <div id="scene-content" class="flex-1 flex flex-col justify-center z-10 scene-transition">
            <!-- Scenes will be injected here via JS -->
        </div>

        <!-- Bottom Navigation & Copyright Footer -->
        <footer class="mt-8 pt-4 border-t-2 border-slate-200/80 flex flex-wrap items-center justify-between gap-4 z-10 no-print">
            <button id="prev-btn" onclick="prevScene()" class="px-5 py-2.5 rounded-xl font-bold text-slate-600 bg-slate-200 hover:bg-slate-300 transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2">
                <span>➡️</span> السابق
            </button>

            <div class="text-center">
                <span class="text-xs md:text-sm font-black text-slate-500 bg-slate-100 px-4 py-1.5 rounded-full border border-slate-200 shadow-inner">
                    جميع الحقوق محفوظة للمصممة: © سميرة الخيبري
                </span>
            </div>

            <button id="next-btn" onclick="nextScene()" class="pixar-btn text-white px-6 py-2.5 rounded-xl font-bold flex items-center gap-2">
                التالي <span>⬅️</span>
            </button>
        </footer>
    </main>

    <!-- Toast Notification for Feedback -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl border-2 border-amber-400 font-bold text-sm opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
        <span id="toast-icon">🎉</span>
        <span id="toast-msg">أحسنت!</span>
    </div>

    <script>
        // --- Audio Synthesizer (Web Audio API for Sound Effects) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(160, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // --- Text-to-Speech (Arabic Voiceover) ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            } else {
                showToast('🔊', 'المتصفح لا يدعم القراءة الصوتية التلقائية');
            }
        }

        function speakCurrentScene() {
            playSound('click');
            speakText(scenes[currentScene].voiceover);
        }

        // --- State Management ---
        let currentScene = 0;
        let points = 0;
        let quizScore = 0;
        let completedTasks = new Set();

        function addPoints(amount, taskId, message) {
            if (!completedTasks.has(taskId)) {
                completedTasks.add(taskId);
                points += amount;
                document.getElementById('points-display').innerText = points;
                playSound('success');
                showToast('⭐', `${message} (+${amount} نقطة)`);
            }
        }

        function showToast(icon, msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-icon').innerText = icon;
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        // --- 3D Character SVG Illustrations (Pixar Inspired) ---
        const characters = {
            tariq: `
                <div class="flex flex-col items-center">
                    <div class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-b from-blue-500 to-blue-700 avatar-3d flex items-center justify-center relative border-4 border-white">
                        <span class="text-5xl md:text-6xl">👨‍💼</span>
                        <span class="absolute -bottom-2 bg-amber-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full shadow">أ. طارق (المدير)</span>
                    </div>
                </div>`,
            rayan: `
                <div class="flex flex-col items-center">
                    <div class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-b from-emerald-400 to-emerald-600 avatar-3d flex items-center justify-center relative border-4 border-white">
                        <span class="text-5xl md:text-6xl">🧑‍💻</span>
                        <span class="absolute -bottom-2 bg-white text-emerald-800 text-[10px] font-black px-2 py-0.5 rounded-full shadow">ريان (الموظف)</span>
                    </div>
                </div>`,
            sara: `
                <div class="flex flex-col items-center">
                    <div class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-b from-purple-500 to-indigo-600 avatar-3d flex items-center justify-center relative border-4 border-white">
                        <span class="text-5xl md:text-6xl">👩‍🏫</span>
                        <span class="absolute -bottom-2 bg-amber-300 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full shadow">سارة (التدريب)</span>
                    </div>
                </div>`
        };

        // --- 10 Scenes Data ---
        const scenes = [
            // Scene 1: Cover
            {
                title: "الغلاف",
                voiceover: "أهلاً بكم في رحلة جديدة من عالم الإدارة والقيادة. اليوم سنكتشف سر القادة الناجحين في تحريك طاقات فرقهم: أدوات التوجيه، الحوافز والتدريب.",
                render: () => `
                    <div class="text-center flex flex-col items-center justify-center py-4">
                        <div class="inline-flex items-center gap-2 bg-blue-100 text-blue-800 px-4 py-1.5 rounded-full font-bold text-sm mb-4 border border-blue-200">
                            <span>🇸🇦 المنهج السعودي</span> • <span>الصف الثالث الثانوي</span>
                        </div>
                        
                        <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-l from-blue-900 via-blue-700 to-emerald-600 mb-3 leading-tight">
                            أدوات التوجيه:<br>الحوافز والتدريب
                        </h1>
                        
                        <p class="text-slate-600 max-w-lg text-base md:text-lg mb-6 font-semibold">
                            قصة تفاعلية مصورة تأخذك داخل بيئة العمل الحديثة لاكتشاف كيف يصنع القائد فريقاً مبدعاً ومنتجاً!
                        </p>

                        <!-- 3D Cast Showcase -->
                        <div class="flex items-center justify-center gap-4 md:gap-8 my-4">
                            <div class="floating">${characters.rayan}</div>
                            <div class="floating-delayed scale-110">${characters.tariq}</div>
                            <div class="floating">${characters.sara}</div>
                        </div>

                        <div class="mt-6 flex flex-wrap justify-center gap-4">
                            <button onclick="nextScene()" class="pixar-btn-gold text-slate-900 font-black text-lg px-8 py-3.5 rounded-2xl flex items-center gap-2 shadow-xl hover:scale-105 transition">
                                <span>🚀</span> ابدأ الرحلة التفاعلية
                            </button>
                        </div>
                        <p class="mt-4 text-xs font-bold text-slate-400">إعداد وتصميم: سميرة الخيبري</p>
                    </div>
                `
            },

            // Scene 2: Introduction / Problem
            {
                title: "التمهيد",
                voiceover: "يمتلك ريان الحماس، لكنه يفتقر إلى مهارة استخدام النظام الجديد، كما أنه لم يتلق أي تقدير على جهوده السابقة. برأيك، ما الذي يحتاجه ريان الآن؟",
                render: () => `
                    <div class="flex flex-col items-center text-center">
                        <span class="bg-amber-100 text-amber-800 font-black px-4 py-1 rounded-full text-sm mb-3">المشهد 2: تحدي في بيئة العمل</span>
                        <h2 class="text-2xl md:text-3xl font-black text-slate-800 mb-4">لماذا تراجع أداء ريان رغم اجتهاده؟</h2>
                        
                        <div class="bg-gradient-to-br from-slate-100 to-blue-50 border-2 border-blue-200 rounded-3xl p-6 max-w-2xl w-full shadow-inner mb-6">
                            <div class="flex flex-col md:flex-row items-center gap-6">
                                <div class="relative">
                                    ${characters.rayan}
                                    <span class="absolute -top-3 -right-3 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full animate-bounce shadow">🪫 طاقة 20%</span>
                                </div>
                                <div class="text-right flex-1">
                                    <p class="text-slate-700 font-bold text-base md:text-lg leading-relaxed">
                                        "تراكمت المهام على طاولة <span class="text-blue-700">ريان</span>، فالنظام التقني الجديد معقد ولم يتعلمه بعد، كما أنه يشعر بالإحباط لعدم تقدير جهوده السابقة!"
                                    </p>
                                </div>
                            </div>
                        </div>

                        <p class="font-black text-blue-900 mb-3 text-lg">🎯 لو كنت مكان المدير (أ. طارق)، كيف ستتصرف؟</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl">
                            <button onclick="handleIntroChoice(false)" class="p-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-red-400 hover:bg-red-50 font-bold text-slate-700 transition text-right flex items-center gap-3">
                                <span class="text-2xl">😠</span>
                                <span>توجيه إنذار له بسبب تأخره في إنجاز المهام.</span>
                            </button>
                            <button onclick="handleIntroChoice(true)" class="p-4 rounded-2xl border-2 border-emerald-300 bg-emerald-50/60 hover:bg-emerald-100 font-bold text-emerald-900 transition text-right flex items-center gap-3 shadow-sm">
                                <span class="text-2xl">💡</span>
                                <span>تحفيزه وتقدير جهوده، وتدريبه على النظام الجديد.</span>
                            </button>
                        </div>
                        <div id="intro-feedback" class="mt-4 font-bold text-sm"></div>
                    </div>
                `
            },

            // Scene 3: Lesson Explanation
            {
                title: "شرح الدرس",
                voiceover: "أدرك المدير طارق أن التوجيه لا يعني إصدار الأوامر فقط، فاستخدم أداتين سحريتين: الحوافز ليشعل رغبة ريان، والتدريب ليرفع قدرته ومهارته.",
                render: () => `
                    <div>
                        <div class="text-center mb-5">
                            <span class="bg-blue-100 text-blue-800 font-black px-4 py-1 rounded-full text-sm">المشهد 3: معادلة التوجيه الناجح</span>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 mt-2">كيف حلّ القائد المشكلة؟</h2>
                        </div>

                        <!-- Formula Banner -->
                        <div class="bg-gradient-to-l from-blue-900 to-indigo-800 text-white rounded-2xl p-4 text-center mb-6 shadow-lg">
                            <p class="text-lg md:text-xl font-black">
                                التوجيه الفعّال = <span class="text-amber-300">حوافز (ترفع الرغبة)</span> + <span class="text-emerald-300">تدريب (يرفع القدرة)</span>
                            </p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Card 1: Incentives -->
                            <div onclick="addPoints(5, 'scene3_inc', 'استكشفت أداة الحوافز!')" class="cursor-pointer bg-amber-50 border-2 border-amber-300 rounded-3xl p-5 hover:scale-[1.02] transition shadow-md">
                                <div class="flex items-center gap-4 mb-3">
                                    ${characters.tariq}
                                    <div>
                                        <span class="bg-amber-400 text-slate-900 text-xs font-black px-2.5 py-1 rounded-lg">الأداة الأولى</span>
                                        <h3 class="text-xl font-black text-amber-900 mt-1">الحوافز (Motivation)</h3>
                                    </div>
                                </div>
                                <p class="text-slate-700 text-sm font-semibold leading-relaxed">
                                    قام أ. طارق بشكر ريان أمام الفريق ومنحه مكافأة تشجيعية، مما أعاد لريان ثقته وحماسه للعمل والإنجاز.
                                </p>
                            </div>

                            <!-- Card 2: Training -->
                            <div onclick="addPoints(5, 'scene3_trn', 'استكشفت أداة التدريب!')" class="cursor-pointer bg-purple-50 border-2 border-purple-300 rounded-3xl p-5 hover:scale-[1.02] transition shadow-md">
                                <div class="flex items-center gap-4 mb-3">
                                    ${characters.sara}
                                    <div>
                                        <span class="bg-purple-600 text-white text-xs font-black px-2.5 py-1 rounded-lg">الأداة الثانية</span>
                                        <h3 class="text-xl font-black text-purple-900 mt-1">التدريب (Training)</h3>
                                    </div>
                                </div>
                                <p class="text-slate-700 text-sm font-semibold leading-relaxed">
                                    قامت أخصائية التدريب (سارة) بتدريب ريان عملياً على النظام الجديد حتى أتقنه بسرعة ودقة عالية.
                                </p>
                            </div>
                        </div>
                        <p class="text-center text-xs text-slate-500 mt-4 font-bold">💡 انقر على البطاقات لجمع النقاط!</p>
                    </div>
                `
            },

            // Scene 4: Vocabulary
            {
                title: "المفردات الجديدة",
                voiceover: "دعونا نتعرف معاً على أهم المفاهيم الإدارية في درسنا اليوم. انقر على كل بطاقة لتستمع إلى تعريفها.",
                render: () => `
                    <div>
                        <div class="text-center mb-6">
                            <span class="bg-emerald-100 text-emerald-800 font-black px-4 py-1 rounded-full text-sm">المشهد 4: قاموس القائد الإداري</span>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 mt-2">المفاهيم والمصطلحات الأساسية</h2>
                            <p class="text-sm text-slate-500 font-bold">انقر على أي بطاقة لسماع النطق وكسب النقاط 🔊</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${[
                                { id: 'v1', icon: '🏆', title: 'الحوافز', desc: 'مجموعة العوامل والمؤثرات الخارجية التي تثير دافعية الفرد وتوجه سلوكه نحو زيادة الإنتاجية.', color: 'blue' },
                                { id: 'v2', icon: '💰', title: 'الحوافز المادية', desc: 'حوافز ملموسة ذات قيمة مالية مثل: المكافآت، العلاوات، البدلات، والترقيات الوظيفية.', color: 'amber' },
                                { id: 'v3', icon: '🌟', title: 'الحوافز المعنوية', desc: 'حوافز غير مالية تشبع حاجات التقدير مثل: خطابات الشكر، الثناء، والمرونة في العمل.', color: 'emerald' },
                                { id: 'v4', icon: '🎓', title: 'التدريب', desc: 'نشاط منظم ومستمر يهدف إلى تزويد الفرد بالمهارات والمعارف والاتجاهات اللازمة لأداء عمله بكفاءة.', color: 'purple' }
                            ].map(item => `

                addPoints(10, 'intro_q', 'قرار قيادي حكيم!');
            } else {
                playSound('error');
                fb.innerHTML = '<span class="text-red-700 bg-red-100 px-4 py-2 rounded-xl inline-block">🤔 العقاب وحده لا يحل نقص المهارة! جرب الخيار الآخر.</span>';
            }
        }

        function checkSort(rowId, selected, correct) {
            const row = document.getElementById(`row-${rowId}`);
            if (selected === correct) {
                row.classList.remove('bg-slate-50', 'border-slate-200');
                row.classList.add('bg-emerald-50', 'border-emerald-400');
                addPoints(5, rowId, 'تصنيف صحيح!');
            } else {
                playSound('error');
                showToast('⚠️', 'حاول مرة أخرى! فكر هل هو مالي أم معنوي؟');
            }
        }

        function answerQuiz(btn, isCorrect) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('.q-btn');
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.remove('bg-white');
                btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                quizScore++;
                addPoints(10, 'quiz_' + Math.random(), 'إجابة صحيحة في التحدي!');
            } else {
                playSound('error');
                btn.classList.remove('bg-white');
                btn.classList.add('bg-red-500', 'text-white', 'border-red-600');
                showToast('❌', 'إجابة غير صحيحة، راجع المفهوم في المشهد 4 و 5');
            }
        }

        function updateCertName(val) {
            const display = document.getElementById('cert-name-display');
            display.innerText = val.trim() ? val : '[ اسم الطالب / الطالبة ]';
        }

        // --- Navigation Logic ---
        function renderScene() {
            const container = document.getElementById('scene-content');
            container.classList.remove('scene-transition');
            void container.offsetWidth; // trigger reflow
            container.classList.add('scene-transition');
            
            container.innerHTML = scenes[currentScene].render();

            // Update HUD
            const step = currentScene + 1;
            const percent = step * 10;
            document.getElementById('scene-counter').innerText = step;
            document.getElementById('progress-percent').innerText = percent + '%';
            document.getElementById('progress-bar').style.width = percent + '%';

            // Update Buttons
            document.getElementById('prev-btn').disabled = currentScene === 0;
            const nextBtn = document.getElementById('next-btn');
            if (currentScene === scenes.length - 1) {
                nextBtn.style.visibility = 'hidden';
            } else {
                nextBtn.style.visibility = 'visible';
            }
        }

        function nextScene() {
            if (currentScene < scenes.length - 1) {
                playSound('click');
                window.speechSynthesis.cancel();
                currentScene++;
                renderScene();
            }
        }

        function prevScene() {
            if (currentScene > 0) {
                playSound('click');
                window.speechSynthesis.cancel();
                currentScene--;
                renderScene();
            }
        }

        function restartMagazine() {
            playSound('click');
            currentScene = 0;
            renderScene();
        }

        // Initialize First Scene
        renderScene();
    </script>
